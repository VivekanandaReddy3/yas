name: CI

# Run Ueber's verification in the pinned container (Dockerfile) on every push
# and pull request, and fail if anything breaks (.github/ci/ueber-verify.sh).
# The matrix runs the same check on further SWI-Prolog versions:
#   7.6.4   oldest swipl image available (the repository targets 7.2.3)
#   9.3.35  last 9.x image
#   10.0.2  the pinned version (Dockerfile default)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Ueber verification (SWI-Prolog ${{ matrix.swi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swi: ["7.6.4", "9.3.35", "10.0.2"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the container
        run: docker build --build-arg SWI_VERSION=${{ matrix.swi }} -t yas:${{ matrix.swi }} .

      - name: Run Ueber verification
        run: |
          docker run --rm -e GITHUB_SHA -v "$PWD/out:/out" yas:${{ matrix.swi }} \
            bash .github/ci/ueber-verify.sh /out

      - name: Publish the report on the run page
        if: always()
        run: cat out/ueber-report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report produced"

      - name: Archive the log and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueber-verification-swi-${{ matrix.swi }}
          path: out/
