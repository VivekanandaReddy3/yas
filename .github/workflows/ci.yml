name: CI

# Run Ueber's verification in the pinned container (Dockerfile) on every push
# and pull request, and fail if anything breaks (.github/ci/ueber-verify.sh).
# The matrix runs the same check on further SWI-Prolog versions:
#   7.6.4   oldest swipl image available (the repository targets 7.2.3)
#   9.3.35  last 9.x image
#   10.0.2  the pinned version (Dockerfile default)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Ueber verification (SWI-Prolog ${{ matrix.swi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swi: ["7.6.4", "9.3.35", "10.0.2"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Build the container
        run: docker build --build-arg SWI_VERSION=${{ matrix.swi }} -t yas:${{ matrix.swi }} .

      - name: Run Ueber verification
        run: |
          docker run --rm -e GITHUB_SHA -v "$PWD/out:/out" yas:${{ matrix.swi }} \
            bash .github/ci/ueber-verify.sh /out

      - name: Publish the report on the run page
        if: always()
        run: cat out/ueber-report.md >> "$GITHUB_STEP_SUMMARY" || echo "no report produced"

      - name: Archive the log and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ueber-verification-swi-${{ matrix.swi }}
          path: out/

  publish:
    name: Publish the verification report
    needs: verify
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/thesis/setup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repository with its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch the report of the pinned toolchain
        uses: actions/download-artifact@v4
        with:
          name: ueber-verification-swi-10.0.2
          path: out

      - name: Check out the gh-pages branch
        run: |
          if git fetch origin gh-pages; then
            git worktree add site FETCH_HEAD --detach
          else
            git worktree add site --detach
            git -C site checkout --orphan gh-pages
            git -C site rm -rfq .
          fi

      - name: Build the page
        run: python3 .github/ci/health-page.py out site

      - name: Push the page
        run: |
          cd site
          touch .nojekyll
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Report for ${GITHUB_SHA::7}" || exit 0
          git push origin HEAD:gh-pages
